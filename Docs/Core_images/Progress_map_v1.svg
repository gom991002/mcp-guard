<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">mcp-guard MVP Progress Map</title>
  <desc id="desc">Architecture progress map showing completed, partial, todo, and auxiliary parts of mcp-guard.</desc>
  <defs>
    <style>
      .bg { fill: #0e2a43; }
      .grid { stroke: #26455f; stroke-width: 1; opacity: 0.45; }
      .title { fill: #edf6ff; font: 700 44px Arial, sans-serif; }
      .subtitle { fill: #a9bdd2; font: 20px Arial, sans-serif; }
      .section { fill: rgba(21, 59, 91, 0.72); stroke: #5c7894; stroke-width: 2; stroke-dasharray: 8 8; }
      .section-title { fill: #d9e8f6; font: 700 22px Arial, sans-serif; }
      .box { rx: 10; ry: 10; stroke-width: 2.5; }
      .done { fill: #e7fff4; stroke: #39d98a; }
      .partial { fill: #fff8df; stroke: #f6c343; }
      .todo { fill: #f1f5fa; stroke: #9fb3c8; }
      .aux { fill: #f4ebff; stroke: #9c6bff; }
      .blocked { fill: #ffecef; stroke: #ff667c; }
      .box-title { fill: #142333; font: 700 20px Arial, sans-serif; }
      .box-text { fill: #334b60; font: 15px Arial, sans-serif; }
      .pill-text { fill: #102030; font: 700 13px Arial, sans-serif; }
      .label { fill: #b9cce0; font: 15px Arial, sans-serif; }
      .arrow { stroke: #d8e7f5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #b9cce0; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-soft); }
      .legend-text { fill: #e5f0fb; font: 17px Arial, sans-serif; }
      .small { font-size: 13px; }
    </style>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" class="grid"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#d8e7f5"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b9cce0"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <rect width="1800" height="1200" fill="url(#grid)" opacity="0.9"/>

  <text x="70" y="82" class="title">mcp-guard MVP 진행 모식도</text>
  <text x="70" y="116" class="subtitle">현재 구현 범위: 원격 게이트웨이 코어 · 서버 등록 설정 · tools/list 필터링 · 간접 인젝션 보조 딜레이</text>
  <text x="1580" y="82" class="title" style="font-size:34px;">2026-10-30</text>
  <text x="1584" y="112" class="subtitle">progress-map.svg</text>

  <rect x="70" y="158" width="390" height="860" class="section"/>
  <text x="100" y="198" class="section-title">AI 클라이언트 / 진입</text>

  <rect x="92" y="250" width="320" height="92" class="box todo"/>
  <text x="118" y="286" class="box-title">ChatGPT · Claude</text>
  <text x="118" y="314" class="box-text">guard 선택 → gateway</text>
  <text x="118" y="336" class="box-text">직접 선택 → 원 서버 (검사 밖)</text>

  <rect x="92" y="430" width="320" height="105" class="box todo"/>
  <text x="118" y="466" class="box-title">로컬 프록시 L1-L4</text>
  <text x="118" y="494" class="box-text">managed config · wrapper</text>
  <text x="118" y="516" class="box-text">config watch · hook TODO</text>

  <rect x="92" y="705" width="320" height="118" class="box aux"/>
  <text x="118" y="742" class="box-title">IP 딜레이 보조 수단</text>
  <text x="118" y="770" class="box-text">Gamma-Poisson lambda</text>
  <text x="118" y="792" class="box-text">B/M1/M4 신호 누적 시 delay</text>
  <text x="118" y="814" class="box-text">AUX DONE · 주 방어 아님</text>

  <rect x="520" y="158" width="760" height="860" class="section"/>
  <text x="550" y="198" class="section-title">mcp-guard 원격 경로</text>

  <rect x="560" y="245" width="280" height="100" class="box done"/>
  <text x="584" y="282" class="box-title">S0_GATEWAY_*</text>
  <text x="584" y="310" class="box-text">HTTP edge 검사</text>
  <text x="584" y="332" class="box-text">method · origin · header</text>

  <rect x="940" y="245" width="280" height="100" class="box partial"/>
  <text x="964" y="282" class="box-title">/mcp gateway core</text>
  <text x="964" y="310" class="box-text">JSON-RPC in-memory</text>
  <text x="964" y="332" class="box-text">HTTP 어댑터 완료</text>

  <rect x="560" y="425" width="280" height="105" class="box done"/>
  <text x="584" y="462" class="box-title">서버 등록 설정</text>
  <text x="584" y="490" class="box-text">servers.json 로딩</text>
  <text x="584" y="512" class="box-text">정책 정합성 검사</text>

  <rect x="940" y="425" width="280" height="105" class="box partial"/>
  <text x="964" y="462" class="box-title">tools/list relay</text>
  <text x="964" y="490" class="box-text">실제 목록 검사 · 캐시</text>
  <text x="964" y="512" class="box-text">인증/승인 UI는 TODO</text>

  <rect x="560" y="605" width="280" height="105" class="box done"/>
  <text x="584" y="642" class="box-title">정책 엔진</text>
  <text x="584" y="670" class="box-text">allow · review · block</text>
  <text x="584" y="692" class="box-text">0단계 일부 + 2단계 일부</text>

  <rect x="940" y="605" width="280" height="105" class="box partial"/>
  <text x="964" y="642" class="box-title">tools/call relay</text>
  <text x="964" y="670" class="box-text">upstream 클라이언트 있음</text>
  <text x="964" y="692" class="box-text">호출 경로 결합 일부</text>

  <rect x="560" y="785" width="280" height="105" class="box partial"/>
  <text x="584" y="822" class="box-title">M1 감사 이벤트</text>
  <text x="584" y="850" class="box-text">event model 있음</text>
  <text x="584" y="872" class="box-text">영구 저장 TODO</text>

  <rect x="940" y="785" width="280" height="105" class="box todo"/>
  <text x="964" y="822" class="box-title">실제 MCP 서버</text>
  <text x="964" y="850" class="box-text">network transport PARTIAL</text>
  <text x="964" y="872" class="box-text">OAuth · token custody TODO</text>

  <rect x="1340" y="158" width="390" height="860" class="section"/>
  <text x="1370" y="198" class="section-title">설계 단계별 진행도</text>

  <rect x="1370" y="245" width="310" height="78" class="box partial"/>
  <text x="1394" y="278" class="box-title">0단계 보호 경로</text>
  <text x="1394" y="304" class="box-text">선택 경로 통제 PARTIAL</text>

  <rect x="1370" y="360" width="310" height="78" class="box todo"/>
  <text x="1394" y="393" class="box-title">1단계 정상 연동</text>
  <text x="1394" y="419" class="box-text">registry 검증 · version TODO</text>

  <rect x="1370" y="475" width="310" height="78" class="box partial"/>
  <text x="1394" y="508" class="box-title">2단계 등록 검사</text>
  <text x="1394" y="534" class="box-text">M2/M3/B 일부 PARTIAL</text>

  <rect x="1370" y="590" width="310" height="78" class="box todo"/>
  <text x="1394" y="623" class="box-title">3단계 응답 처리</text>
  <text x="1394" y="649" class="box-text">M4 출처 태깅 TODO</text>

  <rect x="1370" y="705" width="310" height="78" class="box todo"/>
  <text x="1394" y="738" class="box-title">4단계 봉쇄</text>
  <text x="1394" y="764" class="box-text">값 정책 · 승인 TODO</text>

  <rect x="1370" y="835" width="310" height="96" class="box blocked"/>
  <text x="1394" y="871" class="box-title">남은 큰 작업</text>
  <text x="1394" y="899" class="box-text">운영 ASGI 서버</text>
  <text x="1394" y="921" class="box-text">OAuth · 토큰 보관 연동</text>

  <path class="arrow" d="M412 296 H548"/>
  <path class="arrow" d="M840 296 H928"/>
  <path class="arrow" d="M1080 346 V413"/>
  <path class="arrow" d="M840 478 H928"/>
  <path class="arrow" d="M700 530 V593"/>
  <path class="arrow" d="M1080 530 V593"/>
  <path class="arrow" d="M700 710 V773"/>
  <path class="arrow-soft" d="M252 705 V355 C252 326 278 296 412 296"/>
  <path class="arrow-soft" d="M1220 837 H1328"/>
  <path class="arrow-soft" d="M1220 657 H1328"/>
  <path class="arrow-soft" d="M1220 477 H1328"/>

  <rect x="70" y="1060" width="1660" height="90" rx="10" ry="10" fill="#143b5c" stroke="#335f82"/>
  <rect x="105" y="1086" width="28" height="18" class="done box"/>
  <text x="145" y="1101" class="legend-text">DONE: MVP 단위 구현·테스트 완료</text>
  <rect x="455" y="1086" width="28" height="18" class="partial box"/>
  <text x="495" y="1101" class="legend-text">PARTIAL: 코어 초안 또는 stub</text>
  <rect x="780" y="1086" width="28" height="18" class="todo box"/>
  <text x="820" y="1101" class="legend-text">TODO: 미구현</text>
  <rect x="1035" y="1086" width="28" height="18" class="aux box"/>
  <text x="1075" y="1101" class="legend-text">AUX: 보조 방어, 주 판정 아님</text>
  <text x="1370" y="1101" class="legend-text">Tests: 89 OK</text>
  <text x="105" y="1132" class="subtitle small">현재 다음 후보: 실제 HTTP/ASGI 서버 또는 tools/call upstream relay</text>
</svg>
